name: Deploy to Railway

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        cd EarnQuest/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Test Flask app
      run: |
        cd EarnQuest/backend
        python -c "from app import app; print('Flask app imports successfully')"

  deploy:
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install Railway CLI
      run: npm install -g @railway/cli
      
    - name: Deploy to Railway
      run: |
        # Only deploy if RAILWAY_TOKEN is set
        if [ -n "$RAILWAY_TOKEN" ]; then
          railway up --service earnquest-backend
        else
          echo "RAILWAY_TOKEN not set - skipping deployment"
          echo "To enable automatic deployments, add RAILWAY_TOKEN to GitHub Secrets"
        fi
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      working-directory: ./EarnQuest/backend
